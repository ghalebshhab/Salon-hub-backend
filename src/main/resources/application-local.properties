# Deterministic local development datasource.
# These literal values intentionally override machine-level DB_* variables.
spring.application.name=SalonBooking
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/salon_dbv2}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Local browsers must not inherit production-only origins from the host machine.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4174,http://127.0.0.1:4174,http://localhost:3000,http://127.0.0.1:3000

# Temporary local-only code for email verification and password recovery.
# Production does not load this profile and continues to use secure random codes.
app.auth.fixed-code=123456

# Emails go to the log by default. Set MAIL_DELIVERY=smtp in .env to send real emails.
app.mail.delivery=${MAIL_DELIVERY:log}
