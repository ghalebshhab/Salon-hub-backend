spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/salon_dbv2}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that the entities match it. An existing database without Flyway history is marked
# as version 1 on first start and gets only the newer migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# SQL logs are on in the local profile only: they would write user data to the production logs.
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=42MB

# ===============================
# Email SMTP Configuration
# ===============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-reply@example.com}
spring.mail.password=${MAIL_PASSWORD:local-dev-placeholder}

spring.mail.properties.mail.smtp.auth=true
# Port 587 uses STARTTLS (default). Port 465 uses SSL: set MAIL_SSL_ENABLED=true and MAIL_STARTTLS=false.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.mail.from-name=${MAIL_FROM_NAME:SalonHub}
# smtp = real email, log = write the email to the log only
app.mail.delivery=${MAIL_DELIVERY:smtp}
app.mail.login-alerts=${MAIL_LOGIN_ALERTS:true}
# Base URL for the links in emails
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# JWT Configuration
# ===============================

jwt.secret=${JWT_SECRET}

# Sign-in sessions. The access JWT is short; the refresh token rotates on each use.
# Both live in httpOnly, Secure, SameSite=Strict cookies (see AuthCookies).
salon.auth.access-ttl=${AUTH_ACCESS_TTL:PT15M}
salon.auth.refresh-ttl=${AUTH_REFRESH_TTL:P14D}
salon.auth.admin-ttl=${AUTH_ADMIN_TTL:PT8H}
salon.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
salon.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.code-secret=${AUTH_CODE_SECRET:${JWT_SECRET}}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}

# Cloudinary media storage. Keep the API secret on the backend only.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Google Maps Routes API for drive times with live traffic ("Leave on time").
# Without a key the app uses a distance estimate. Keep the key on the backend only.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Assistant (Lamsa). Without an API key the built-in guide writes the replies.
salonhub.assistant.anthropic-api-key=${ANTHROPIC_API_KEY:}
salonhub.assistant.model=${ASSISTANT_MODEL:claude-opus-5-5}

# Platform commission on each payment, in basis points (100 = 1%). Kept at 0 for now.
salon.payments.commission-rate-bps=${PAYMENT_COMMISSION_BPS:0}

# Where salon owners send plan payments. Empty alias: CliQ is not offered yet.
salon.billing.cliq-alias=${BILLING_CLIQ_ALIAS:}
salon.billing.cliq-name=${BILLING_CLIQ_NAME:SalonHub}
salon.billing.support-phone=${BILLING_SUPPORT_PHONE:}
